<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Administration · AI Climate Risk Portfolio Explorer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root { --bg:#0b1220; --card:#0f172a; --line:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#2563eb; --ok:#34d399; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           display:flex; align-items:center; justify-content:center; padding:16px; }
    .card { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line);
            border-radius:14px; padding:28px; box-shadow:0 20px 40px -10px rgba(0,0,0,.5); }
    h1 { font-size:18px; margin:0 0 4px; }
    p { color:var(--muted); font-size:13px; line-height:1.5; margin:0 0 18px; }
    .user { display:flex; align-items:center; gap:10px; background:#0b1220; border:1px solid var(--line);
            border-radius:10px; padding:12px; font-size:13px; margin-bottom:18px; }
    .user i { color:var(--ok); }
    .row { display:flex; gap:10px; }
    a.btn { flex:1; text-align:center; text-decoration:none; font-size:13px; font-weight:700;
            padding:10px; border-radius:8px; color:#fff; background:var(--accent); }
    a.btn.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  </style>
</head>
<body>
  <div class="card">
    <h1><i class="fas fa-shield-halved"></i> Administration</h1>
    <p>Restricted area for SEI administrators and staff.</p>
    <div class="user"><i class="fas fa-circle-check"></i> <span id="who">Checking session…</span></div>
    <div class="row">
      <a class="btn ghost" href="/"><i class="fas fa-map"></i> Back to explorer</a>
      <a class="btn" href="/cdn-cgi/access/logout"><i class="fas fa-right-from-bracket"></i> Sign out</a>
    </div>
  </div>
  <script>
    // Cloudflare Access exposes the signed-in user's identity on this endpoint.
    fetch('/cdn-cgi/access/get-identity', { credentials: 'include' })
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(id => { document.getElementById('who').textContent = 'Signed in as ' + (id.email || 'unknown'); })
      .catch(() => { document.getElementById('who').textContent = 'No active session'; });
  </script>
</body>
</html>
