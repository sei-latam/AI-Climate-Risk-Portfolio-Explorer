<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Administration · AI Climate Risk Portfolio Explorer</title>
  <link rel="icon" type="image/png" href="../logo-inst3.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root, html[data-theme="dark"] {
      --bg:#0b1220; --panel:#0f172a; --panel2:#111c33; --line:#1e293b; --line2:#334155;
      --text:#e2e8f0; --strong:#f8fafc; --muted:#94a3b8; --faint:#64748b;
      --blue:#3b82f6; --blue-bg:rgba(59,130,246,.14); --green:#34d399; --green-bg:rgba(16,185,129,.14);
      --amber:#fbbf24; --amber-bg:rgba(245,158,11,.14); --rose:#fb7185; --rose-bg:rgba(244,63,94,.14);
      --violet:#a78bfa; --violet-bg:rgba(139,92,246,.14); --sky:#38bdf8; --sky-bg:rgba(14,165,233,.14);
      --code:#6ee7b7; --shadow:0 20px 40px -18px rgba(0,0,0,.6);
    }
    html[data-theme="light"] {
      --bg:#f1f5f9; --panel:#ffffff; --panel2:#f8fafc; --line:#e2e8f0; --line2:#cbd5e1;
      --text:#1e293b; --strong:#0f172a; --muted:#475569; --faint:#64748b;
      --blue:#2563eb; --blue-bg:rgba(37,99,235,.09); --green:#047857; --green-bg:rgba(4,120,87,.09);
      --amber:#b45309; --amber-bg:rgba(180,83,9,.09); --rose:#be123c; --rose-bg:rgba(190,18,60,.08);
      --violet:#6d28d9; --violet-bg:rgba(109,40,217,.08); --sky:#0369a1; --sky-bg:rgba(3,105,161,.08);
      --code:#065f46; --shadow:0 16px 30px -20px rgba(15,23,42,.35);
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:13px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    a { color:inherit; }
    button, select, input, textarea { font:inherit; color:inherit; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    html.redirecting body > * { visibility:hidden; }

    /* Encabezado */
    header { position:sticky; top:0; z-index:20; background:var(--panel); border-bottom:1px solid var(--line); }
    .bar { max-width:1400px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .brand { display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
    .brand img { height:26px; }
    .brand b { color:var(--strong); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .brand small { color:var(--muted); display:block; font-size:11px; }
    .tools { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .chip { display:inline-flex; align-items:center; gap:6px; padding:5px 9px; border:1px solid var(--line2); border-radius:8px; background:var(--panel2); font-size:12px; white-space:nowrap; text-decoration:none; cursor:pointer; }
    .chip:hover { border-color:var(--blue); }
    .chip.user i { color:var(--green); }
    .chip.out { color:var(--rose); }
    select.chip { padding:5px 6px; }
    .proto { background:var(--amber-bg); color:var(--amber); border:1px solid color-mix(in srgb, var(--amber) 40%, transparent); padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap; }

    /* Pestañas */
    nav { max-width:1400px; margin:0 auto; padding:0 16px; display:flex; gap:4px; overflow-x:auto; }
    nav button { background:none; border:0; border-bottom:2px solid transparent; padding:9px 12px; color:var(--muted); cursor:pointer; white-space:nowrap; font-weight:600; }
    nav button.on { color:var(--strong); border-color:var(--blue); }
    nav .count { background:var(--rose-bg); color:var(--rose); border-radius:999px; padding:0 6px; font-size:11px; margin-left:4px; }

    main { max-width:1400px; margin:0 auto; padding:16px; }
    .notice { display:flex; gap:10px; align-items:flex-start; background:var(--amber-bg); border:1px solid color-mix(in srgb, var(--amber) 35%, transparent); color:var(--text); padding:10px 12px; border-radius:10px; margin-bottom:16px; font-size:12px; }
    .notice i { color:var(--amber); margin-top:2px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; box-shadow:var(--shadow); }
    .card h3 { margin:0 0 10px; font-size:13px; color:var(--strong); display:flex; align-items:center; gap:8px; }
    .grid { display:grid; gap:14px; }
    .kpis { grid-template-columns:repeat(4, minmax(0,1fr)); }
    .two { grid-template-columns:1fr 1fr; }
    .kpi .v { font-size:26px; font-weight:800; color:var(--strong); line-height:1.1; }
    .kpi .l { color:var(--muted); font-size:12px; }
    .kpi .s { color:var(--faint); font-size:11px; }
    .muted { color:var(--muted); } .faint { color:var(--faint); }
    .hidden { display:none !important; }

    /* Diagrama del flujo */
    .flow { display:flex; align-items:stretch; gap:6px; overflow-x:auto; padding:4px 2px 8px; }
    .node { flex:1 0 128px; border:1px solid var(--line2); border-radius:10px; padding:10px; background:var(--panel2); text-align:center; font-size:12px; }
    .node i { font-size:16px; display:block; margin-bottom:4px; }
    .node b { display:block; color:var(--strong); font-size:12px; }
    .node.hitl { border:2px solid var(--green); background:var(--green-bg); }
    .arrow { align-self:center; color:var(--faint); flex:0 0 auto; }
    .loop { margin-top:6px; font-size:12px; color:var(--muted); display:flex; gap:8px; align-items:center; }

    .bars .row { display:grid; grid-template-columns:150px 1fr 34px; gap:8px; align-items:center; margin:6px 0; font-size:12px; }
    .bars .track { height:8px; background:var(--panel2); border:1px solid var(--line); border-radius:99px; overflow:hidden; }
    .bars .fill { height:100%; background:var(--blue); border-radius:99px; }

    /* Cola de revisión */
    .queue { grid-template-columns:360px minmax(0,1fr); align-items:start; }
    .filters { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
    .filters button { border:1px solid var(--line2); background:var(--panel2); border-radius:999px; padding:3px 10px; cursor:pointer; font-size:12px; color:var(--muted); }
    .filters button.on { border-color:var(--blue); color:var(--strong); background:var(--blue-bg); }
    .list { display:flex; flex-direction:column; gap:8px; max-height:calc(100vh - 250px); overflow:auto; padding-right:2px; }
    .item { border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--panel2); cursor:pointer; text-align:left; width:100%; }
    .item:hover { border-color:var(--line2); }
    .item.sel { border-color:var(--blue); box-shadow:0 0 0 1px var(--blue) inset; }
    .item .q { color:var(--strong); font-weight:600; font-size:12.5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .item .m { color:var(--faint); font-size:11px; margin-top:4px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .badge { display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:1px 8px; font-size:11px; font-weight:700; white-space:nowrap; }
    .b-pending { background:var(--amber-bg); color:var(--amber); }
    .b-approved { background:var(--green-bg); color:var(--green); }
    .b-corrected { background:var(--blue-bg); color:var(--blue); }
    .b-rejected { background:var(--rose-bg); color:var(--rose); }
    .b-live { background:var(--violet-bg); color:var(--violet); }
    .b-flag { background:var(--rose-bg); color:var(--rose); }

    .detail .head { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; flex-wrap:wrap; margin-bottom:12px; }
    .detail .head .q { font-size:15px; font-weight:700; color:var(--strong); }
    .steps { display:flex; flex-direction:column; gap:10px; }
    .step { border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    .step > .t { display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--panel2); border-bottom:1px solid var(--line); font-weight:700; color:var(--strong); font-size:12.5px; }
    .step > .t .n { width:20px; height:20px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center; font-size:11px; }
    .step > .c { padding:10px; }
    .s1 .n { background:var(--sky-bg); color:var(--sky); } .s2 .n { background:var(--amber-bg); color:var(--amber); }
    .s3 .n { background:var(--green-bg); color:var(--green); } .s4 .n { background:var(--violet-bg); color:var(--violet); }
    .kv { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); gap:6px 14px; font-size:12px; }
    .kv > div > span:first-child { color:var(--faint); display:block; font-size:11px; }
    pre { margin:6px 0 0; padding:8px; background:var(--bg); border:1px solid var(--line); border-radius:8px; color:var(--code); font-size:11px; max-height:170px; overflow:auto; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th { text-align:left; color:var(--faint); font-size:11px; text-transform:uppercase; letter-spacing:.03em; padding:5px 6px; border-bottom:1px solid var(--line2); }
    td { padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
    td.num, th.num { text-align:right; font-family:ui-monospace,Menlo,Consolas,monospace; }
    .up { color:var(--rose); } .down { color:var(--green); }
    .answer { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px; }
    .answer.old { text-decoration:line-through; opacity:.6; }
    .btn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line2); background:var(--panel2); border-radius:8px; padding:6px 12px; cursor:pointer; font-weight:600; text-decoration:none; font-size:12.5px; }
    .btn:hover { border-color:var(--blue); }
    .btn.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
    .btn.green { background:#059669; border-color:#059669; color:#fff; }
    .stars { color:var(--amber); letter-spacing:1px; }
    .stars .off { color:var(--line2); }

    /* Panel de revisión humana */
    .review { margin-top:12px; border:2px solid var(--green); border-radius:12px; padding:12px; background:var(--green-bg); }
    .review h4 { margin:0 0 8px; color:var(--strong); font-size:13px; display:flex; gap:8px; align-items:center; }
    .decisions { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .decisions label { display:flex; align-items:center; gap:6px; border:1px solid var(--line2); background:var(--panel); padding:6px 10px; border-radius:8px; cursor:pointer; font-weight:600; }
    .decisions input { accent-color:var(--blue); }
    .cats { display:flex; gap:6px 12px; flex-wrap:wrap; margin:6px 0 10px; font-size:12px; }
    .cats label { display:flex; gap:5px; align-items:center; cursor:pointer; }
    textarea, input[type=text] { width:100%; background:var(--panel); border:1px solid var(--line2); border-radius:8px; padding:7px 9px; resize:vertical; }
    textarea:focus, input:focus, select:focus { outline:2px solid color-mix(in srgb, var(--blue) 50%, transparent); outline-offset:0; }
    .field { margin-bottom:8px; } .field > span { display:block; font-size:11px; color:var(--muted); margin-bottom:3px; font-weight:600; }
    .done { border:1px solid var(--line2); border-radius:10px; padding:10px; background:var(--panel2); margin-top:12px; font-size:12px; }

    .modes { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .mode { border:1px solid var(--line2); border-radius:10px; padding:12px; cursor:pointer; background:var(--panel2); display:block; }
    .mode.on { border:2px solid var(--blue); background:var(--blue-bg); }
    .mode b { color:var(--strong); display:flex; gap:8px; align-items:center; }
    .mode input { accent-color:var(--blue); }
    .empty { text-align:center; color:var(--faint); padding:30px 10px; }
    .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--green); color:var(--text); padding:9px 14px; border-radius:10px; box-shadow:var(--shadow); z-index:50; font-size:12.5px; }

    @media (max-width:1000px) { .queue, .two { grid-template-columns:1fr; } .list { max-height:none; } .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width:560px) { .modes { grid-template-columns:1fr; } .bars .row { grid-template-columns:110px 1fr 30px; } .brand small { display:none; } }
  </style>
  <script>
    // Al volver del login no se muestra la página: solo se guarda la sesión y se regresa al visor
    if (new URLSearchParams(location.search).get('login') === '1') document.documentElement.className = 'redirecting';
    try { if (localStorage.getItem('ace-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
  </script>
</head>
<body>
  <header>
    <div class="bar">
      <div class="brand">
        <img src="../logo-inst1.png" alt="SEI">
        <div style="min-width:0"><b>AI Climate Risk Portfolio Explorer</b><small data-t="adminTitle"></small></div>
        <span class="proto" data-t="proto"></span>
      </div>
      <div class="tools">
        <select id="lang" class="chip" aria-label="Language"><option value="en">🇺🇸 EN</option><option value="es">🇲🇽 ES</option><option value="pt">🇧🇷 PT</option></select>
        <button id="theme" class="chip" aria-label="Theme"><i class="fa-solid fa-moon"></i></button>
        <span class="chip user"><i class="fa-solid fa-user-check"></i> <span id="who" class="mono">…</span></span>
        <a class="chip" href="/"><i class="fa-solid fa-map"></i> <span data-t="back"></span></a>
        <a class="chip out" id="signout" href="#"><i class="fa-solid fa-right-from-bracket"></i> <span data-t="signout"></span></a>
      </div>
    </div>
    <nav id="tabs">
      <button data-tab="overview" class="on"><i class="fa-solid fa-gauge"></i> <span data-t="tOverview"></span></button>
      <button data-tab="queue"><i class="fa-solid fa-list-check"></i> <span data-t="tQueue"></span><span class="count" id="pendingCount">0</span></button>
      <button data-tab="feedback"><i class="fa-solid fa-star"></i> <span data-t="tFeedback"></span></button>
      <button data-tab="audit"><i class="fa-solid fa-clock-rotate-left"></i> <span data-t="tAudit"></span></button>
      <button data-tab="settings"><i class="fa-solid fa-sliders"></i> <span data-t="tSettings"></span></button>
    </nav>
  </header>

  <main>
    <div class="notice"><i class="fa-solid fa-flask"></i><div data-t="notice"></div></div>

    <!-- RESUMEN -->
    <section id="v-overview" class="grid" style="gap:14px">
      <div class="grid kpis" id="kpis"></div>
      <div class="card">
        <h3><i class="fa-solid fa-diagram-project" style="color:var(--green)"></i> <span data-t="howTitle"></span> · <span id="modeName" class="muted" style="font-weight:600"></span></h3>
        <div class="flow" id="flow"></div>
        <div class="loop"><i class="fa-solid fa-arrows-rotate" style="color:var(--green)"></i><span id="flowNote"></span></div>
      </div>
      <div class="grid two">
        <div class="card bars"><h3><i class="fa-solid fa-tags" style="color:var(--blue)"></i> <span data-t="catsTitle"></span></h3><div id="catBars"></div><p class="faint" style="margin:8px 0 0;font-size:11.5px" data-t="catsHelp"></p></div>
        <div class="card bars"><h3><i class="fa-solid fa-star" style="color:var(--amber)"></i> <span data-t="ratingTitle"></span></h3><div id="ratingBars"></div></div>
      </div>
    </section>

    <!-- COLA DE REVISIÓN -->
    <section id="v-queue" class="hidden">
      <div class="grid queue">
        <div class="card">
          <div class="filters" id="filters"></div>
          <div class="list" id="list"></div>
        </div>
        <div class="card detail" id="detail"></div>
      </div>
    </section>

    <!-- OPINIONES -->
    <section id="v-feedback" class="hidden grid" style="gap:14px">
      <div class="grid kpis" id="fbKpis"></div>
      <div class="card"><h3><i class="fa-solid fa-comments" style="color:var(--violet)"></i> <span data-t="fbTitle"></span></h3><div style="overflow-x:auto"><table id="fbTable"></table></div></div>
    </section>

    <!-- REGISTRO -->
    <section id="v-audit" class="hidden">
      <div class="card"><h3><i class="fa-solid fa-clock-rotate-left" style="color:var(--sky)"></i> <span data-t="auditTitle"></span></h3><p class="muted" style="margin:0 0 10px" data-t="auditHelp"></p><div style="overflow-x:auto"><table id="auditTable"></table></div></div>
    </section>

    <!-- AJUSTES -->
    <section id="v-settings" class="hidden grid" style="gap:14px">
      <div class="card">
        <h3><i class="fa-solid fa-user-shield" style="color:var(--green)"></i> <span data-t="modeTitle"></span></h3>
        <div class="modes" id="modes"></div>
      </div>
      <div class="grid two">
        <div class="card">
          <h3><i class="fa-solid fa-users" style="color:var(--blue)"></i> <span data-t="revTitle"></span></h3>
          <table><tbody id="reviewers"></tbody></table>
          <p class="faint" style="margin:10px 0 0;font-size:11.5px" data-t="revHelp"></p>
        </div>
        <div class="card">
          <h3><i class="fa-solid fa-shield-halved" style="color:var(--violet)"></i> <span data-t="privTitle"></span></h3>
          <p class="muted" style="margin:0 0 12px" data-t="privText"></p>
          <button class="btn" id="reset"><i class="fa-solid fa-rotate-left"></i> <span data-t="reset"></span></button>
        </div>
      </div>
    </section>
  </main>

  <script>
  // =======================================================================
  // ADMINISTRACIÓN Y HUMAN-IN-THE-LOOP · PROTOTIPO

  // ('ace-hitl-runs'). Las decisiones se guardan solo en este navegador.
  // =======================================================================

  // ---------------- Estado (en este navegador) ----------------
  var ADMIN_KEY = 'ace-hitl-admin';
  var S = loadState();
  var view = 'overview', filter = 'all', selected = null;

  function loadState() {
    var s = null;
    try { s = JSON.parse(get(ADMIN_KEY) || 'null'); } catch (e) {}
    if (!s || !Array.isArray(s.items)) s = { mode:'post', items:sampleData(), audit:sampleAudit() };
    return s;
  }
  function sampleAudit() {
    return sampleData().filter(function (x) { return x.review; }).map(function (x) {
      return { at:x.review.at, by:'reviewer', action:x.review.decision, id:x.id, query:x.query, note:x.review.note };
    });
  }
  function saveState() { set(ADMIN_KEY, JSON.stringify(S)); }

  /** Suma las consultas reales hechas en el visor de este navegador */
  function mergeLive() {
    var live = [];
    try { live = JSON.parse(get('ace-hitl-runs') || '[]'); } catch (e) {}
    live.forEach(function (r) {
      if (!r || !r.id || !r.answerHTML) return;
      var cur = S.items.find(function (x) { return x.id === r.id; });
      if (!cur) {
        var it = JSON.parse(JSON.stringify(r)); it.origin = 'live'; it.status = 'pending'; it.user = 'U-' + r.id.slice(-4).toUpperCase();
        it.outside = (r.payload && r.payload.assets ? r.payload.assets.filter(function (a) { var v = Object.keys(a).filter(function (k) { return /^\d{4}$/.test(k); }); return v.every(function (k) { return a[k] == null; }); }).length : 0);
        S.items.unshift(it);
      } else if (cur.origin === 'live') {
        cur.delivery = r.delivery || cur.delivery; cur.survey = r.survey || cur.survey; cur.ranking = r.ranking || cur.ranking;
      }
    });
    S.items.sort(function (a, b) { return a.ts < b.ts ? 1 : -1; });
  }

  function reviewerName(by) { return by === 'reviewer' ? (USER || 'reviewer@sei.org') : by; }
  function flags(it) {
    var f = [];
    if (it.survey && it.survey.rating && it.survey.rating <= 2) f.push('fl_rating');
    if (it.survey && it.survey.useful === false) f.push('fl_useful');
    if (it.outside) f.push('fl_outside');
    return f;
  }
  function isPending(it) { return it.status === 'pending'; }
  function fmtDate(iso, withTime) {
    var d = new Date(iso);
    return d.toLocaleDateString(LOCALE[lang], { day:'2-digit', month:'short', year:'numeric' }) + (withTime ? ' · ' + d.toLocaleTimeString(LOCALE[lang], { hour:'2-digit', minute:'2-digit' }) : '');
  }
  function fmtNum(v) { if (v == null || isNaN(v)) return '—'; var a = Math.abs(v); return (+v).toLocaleString(LOCALE[lang], { maximumFractionDigits: a >= 10 ? 1 : a >= 1 ? 2 : 3 }); }
  function signed(v) { return v == null ? '—' : (v > 0 ? '+' : '') + fmtNum(v); }
  function stars(n) { var s = ''; for (var i = 1; i <= 5; i++) s += i <= n ? '★' : '<span class="off">★</span>'; return '<span class="stars">' + s + '</span>'; }
  function statusBadge(it) {
    var k = it.status === 'pending' && S.mode === 'pre' ? 's_pendingPre' : 's_' + it.status;
    var icon = { pending:'fa-hourglass-half', approved:'fa-circle-check', corrected:'fa-pen', rejected:'fa-ban' }[it.status];
    return '<span class="badge b-' + it.status + '"><i class="fa-solid ' + icon + '"></i> ' + tr(k) + '</span>';
  }
  function toast(msg) { document.querySelectorAll('.toast').forEach(function (x) { x.remove(); }); var el = document.createElement('div'); el.className = 'toast'; el.innerHTML = '<i class="fa-solid fa-circle-check" style="color:var(--green)"></i> ' + msg; document.body.appendChild(el); setTimeout(function () { el.remove(); }, 3200); }

  }

  // ---------------- Resumen ----------------
  function renderOverview() {
    var items = S.items, reviewed = items.filter(function (x) { return !isPending(x); });

    var hitl = node('fa-user-shield', 'var(--green)', 'nH', 'nHs', 'hitl'), n4 = node('fa-paper-plane', 'var(--violet)', 'n4', 'n4s');

  // ---------------- Cola de revisión ----------------
  function filtered() {
    return S.items.filter(function (x) {
      if (filter === 'pending') return isPending(x);
      if (filter === 'flagged') return flags(x).length > 0;
      if (filter === 'reviewed') return !isPending(x);
      return true;
    }).sort(function (a, b) {
      // pendientes y marcadas primero
      var pa = (isPending(a) ? 2 : 0) + (flags(a).length ? 1 : 0), pb = (isPending(b) ? 2 : 0) + (flags(b).length ? 1 : 0);
      return pb - pa || (a.ts < b.ts ? 1 : -1);
    });
  }
  function renderQueue() {
    document.getElementById('filters').innerHTML = ['all', 'pending', 'flagged', 'reviewed'].map(function (f) {
      var n = f === 'all' ? S.items.length : f === 'pending' ? S.items.filter(isPending).length : f === 'flagged' ? S.items.filter(function (x) { return flags(x).length; }).length : S.items.filter(function (x) { return !isPending(x); }).length;
      return '<button data-f="' + f + '" class="' + (filter === f ? 'on' : '') + '">' + tr('f' + f.charAt(0).toUpperCase() + f.slice(1)) + ' · ' + n + '</button>';
    }).join('');

        '<div class="m"><span>' + esc(it.varName || it.variable) + '</span>·<span>' + fmtDate(it.ts) + '</span>·<span class="mono">' + esc((it.lang || 'en').toUpperCase()) + '</span></div></button>';
    }).join('') : '<div class="empty">' + tr('emptyList') + '</div>';

  function renderDetail() {

      '<div><span>' + tr('validated') + '</span><b style="color:var(--green)">' + rk.length + '</b></div>' +
      '<div><span>' + tr('outside') + '</span><b style="color:' + (it.outside ? 'var(--rose)' : 'var(--text)') + '">' + (it.outside || 0) + '</b></div>' +

      '<details style="margin-top:6px"><summary class="muted" style="cursor:pointer;font-size:12px"><i class="fa-solid fa-book" style="color:var(--amber)"></i> ' + tr('rag') + '</summary><table style="margin-top:6px"><tbody>' +

      '<div><span>' + tr('channel') + '</span>' + (dv ? (dv.channel === 'email' ? '<i class="fa-solid fa-envelope" style="color:var(--violet)"></i> ' + tr('ch_email') + (dv.to ? ' · <span class="mono">' + esc(dv.to) + '</span>' : '') : '<i class="fa-solid fa-download" style="color:var(--violet)"></i> ' + tr('ch_download')) : tr('ch_none')) + '</div>' +

  function saveReview() {
    var it = S.items.find(function (x) { return x.id === selected; });
    if (!it) return;
    var dec = (document.querySelector('input[name=dec]:checked') || {}).value || 'approved';
    var cats = [].slice.call(document.querySelectorAll('#catBox input:checked')).map(function (x) { return x.value; });
    var note = document.getElementById('noteText').value.trim();
    var corr = dec === 'corrected' ? document.getElementById('corrText').value.trim() : '';
    if (dec !== 'approved' && !cats.length) { toast(tr('needCat')); return; }
    if (dec !== 'approved' && !note) { toast(tr('needNote')); return; }
    var at = new Date().toISOString();
    it.status = dec;
    it.review = { by: USER || 'reviewer@sei.org', at: at, decision: dec, cats: dec === 'approved' ? [] : cats, note: note, corrected: corr };
    S.audit.unshift({ at: at, by: USER || 'reviewer@sei.org', action: dec, id: it.id, query: it.query, note: note });
    saveState();
    toast(tr('saved'));
    renderAll();
  }

    var useful = sv.filter(function (x) { return x.survey.useful === true; }).length;
    var low = sv.filter(function (x) { return x.survey.rating <= 2; }).length;
    var k = [['fa-star', 'var(--amber)', sv.length ? avg.toLocaleString(LOCALE[lang], { maximumFractionDigits:1 }) + ' / 5' : '—', tr('fbAvg')],
             ['fa-thumbs-up', 'var(--green)', sv.length ? Math.round(useful / sv.length * 100) + '%' : '—', tr('fbUseful')],
             ['fa-comments', 'var(--violet)', sv.length, tr('fbResp')], ['fa-flag', 'var(--rose)', low, tr('fbLow')]];
    document.getElementById('fbKpis').innerHTML = k.map(function (c) { return '<div class="card kpi"><div class="l"><i class="fa-solid ' + c[0] + '" style="color:' + c[1] + '"></i> ' + c[3] + '</div><div class="v">' + c[2] + '</div></div>'; }).join('');
    document.getElementById('fbTable').innerHTML = sv.length ? '<thead><tr><th>' + tr('date') + '</th><th>' + tr('query') + '</th><th>' + tr('rating') + '</th><th>' + tr('useful') + '</th><th>' + tr('comment') + '</th></tr></thead><tbody>' +
      sv.map(function (x) { return '<tr><td style="white-space:nowrap">' + fmtDate(x.ts) + '</td><td><a href="#" data-open="' + esc(x.id) + '">' + esc(x.query) + '</a></td><td style="white-space:nowrap">' + stars(x.survey.rating) + '</td><td>' + (x.survey.useful == null ? '—' : x.survey.useful ? tr('yes') : '<b style="color:var(--rose)">' + tr('no') + '</b>') + '</td><td class="muted">' + esc(x.survey.comment || '—') + '</td></tr>'; }).join('') + '</tbody>'
      : '<tbody><tr><td class="empty">' + tr('fbNone') + '</td></tr></tbody>';
  }

  // ---------------- Registro ----------------
  function renderAudit() {
    var a = S.audit.slice().sort(function (x, y) { return x.at < y.at ? 1 : -1; });
    var icon = { approved:'fa-circle-check', corrected:'fa-pen', rejected:'fa-ban' };
    document.getElementById('auditTable').innerHTML = a.length ? '<thead><tr><th>' + tr('when') + '</th><th>' + tr('reviewer') + '</th><th>' + tr('action') + '</th><th>' + tr('item') + '</th><th>' + tr('note') + '</th></tr></thead><tbody>' +
      a.map(function (x) { return '<tr><td style="white-space:nowrap">' + fmtDate(x.at, true) + '</td><td class="mono" style="white-space:nowrap">' + esc(reviewerName(x.by)) + '</td><td><span class="badge b-' + x.action + '"><i class="fa-solid ' + icon[x.action] + '"></i> ' + tr('s_' + x.action) + '</span></td><td><a href="#" data-open="' + esc(x.id) + '">' + esc(x.query) + '</a></td><td class="muted">' + esc(x.note || '—') + '</td></tr>'; }).join('') + '</tbody>'
      : '<tbody><tr><td class="empty">' + tr('auditEmpty') + '</td></tr></tbody>';
  }

  // ---------------- Ajustes ----------------
  function renderSettings() {
    document.getElementById('modes').innerHTML = [['post', 'modePostT', 'modePostD', 'fa-forward'], ['pre', 'modePreT', 'modePreD', 'fa-hand']].map(function (m) {
      return '<label class="mode' + (S.mode === m[0] ? ' on' : '') + '"><b><input type="radio" name="mode" value="' + m[0] + '"' + (S.mode === m[0] ? ' checked' : '') + '> <i class="fa-solid ' + m[3] + '"></i> ' + tr(m[1]) + '</b><p class="muted" style="margin:6px 0 0;font-size:12px">' + tr(m[2]) + '</p></label>';
    }).join('');
    document.getElementById('reviewers').innerHTML = '<tr><td class="mono">' + esc(USER || '—') + ' <span class="faint">(' + tr('revYou') + ')</span></td><td><span class="badge b-approved">' + tr('revRole') + '</span></td></tr>';
  }

  // ---------------- Reporte PDF (con sello de revisión humana) ----------------
  function openReport(id) {
    var it = S.items.find(function (x) { return x.id === id; });
    if (!it) return;
    var w = window.open('', '_blank');
    if (!w) return;
    var rv = it.review;
    var answer = rv && rv.decision === 'corrected' && rv.corrected ? esc(rv.corrected) : safeAnswer(it.answerHTML);
    var stamp = rv ? '<div class="stamp ' + rv.decision + '"><b>' + tr('rStamp') + ': ' + tr('s_' + rv.decision) + '</b><br>' + tr('reviewedBy', { u: esc(reviewerName(rv.by)), d: fmtDate(rv.at, true) }) + (rv.note ? '<br><i>' + esc(rv.note) + '</i>' : '') + '</div>'
      : '<div class="stamp pending"><b>' + tr('rPending') + '</b></div>';
    var rows = (it.ranking || []).map(function (a, i) { return '<tr><td>' + (i + 1) + '</td><td><b>' + esc(a.name) + '</b></td><td class="num">' + fmtNum(a.vA) + '</td><td class="num">' + fmtNum(a.vB) + '</td><td class="num">' + signed(a.diff) + '</td></tr>'; }).join('');
    w.document.write('<!doctype html><html lang="' + lang + '"><head><meta charset="utf-8"><title>Climate_Risk_Summary_' + esc(it.variable) + '.pdf</title><style>' +
      '@page{size:A4;margin:16mm}body{font-family:Arial,Helvetica,sans-serif;color:#0f172a;font-size:11.5px;max-width:180mm;margin:0 auto}' +
      '.top{border-bottom:3px solid #0f766e;padding-bottom:8px;margin-bottom:12px}.brand{font-size:10px;color:#0f766e;font-weight:700;letter-spacing:.08em;text-transform:uppercase}' +
      'h1{font-size:20px;margin:4px 0}h2{font-size:13px;margin:16px 0 6px;color:#0f766e}.muted{color:#64748b}.q{background:#f1f5f9;border-left:4px solid #2563eb;padding:8px 10px;border-radius:4px}' +
      'table{width:100%;border-collapse:collapse;margin-top:6px}th{text-align:left;font-size:9.5px;text-transform:uppercase;color:#475569;border-bottom:1.5px solid #cbd5e1;padding:5px 4px}' +
      'td{padding:5px 4px;border-bottom:1px solid #eef2f7}.num{text-align:right;font-family:"Courier New",monospace}' +
      '.stamp{border:2px solid #059669;color:#065f46;background:#ecfdf5;border-radius:8px;padding:8px 10px;margin:10px 0}.stamp.corrected{border-color:#2563eb;color:#1e3a8a;background:#eff6ff}.stamp.rejected{border-color:#e11d48;color:#881337;background:#fff1f2}.stamp.pending{border-color:#d97706;color:#78350f;background:#fffbeb}' +
      '.note{font-size:9.5px;color:#475569;border-top:1px solid #e2e8f0;margin-top:16px;padding-top:8px;line-height:1.45}.noprint{margin:10px 0}@media print{.noprint{display:none}}' +
      'button{background:#1d4ed8;color:#fff;border:0;border-radius:6px;padding:7px 12px;font-weight:700;cursor:pointer}</style></head><body>' +
      '<div class="noprint"><button onclick="print()">' + tr('rPrint') + '</button></div>' +
      '<div class="top"><div class="brand">SEI · AI Climate Risk Portfolio Explorer</div><h1>' + tr('rTitle') + '</h1><div class="muted">' + fmtDate(it.ts, true) + ' · ' + tr('qid') + ' ' + esc(it.id) + '</div></div>' + stamp +
      '<h2>' + tr('rQuestion') + '</h2><div class="q">' + esc(it.query) + '</div><h2>' + tr('rAnswer') + '</h2><p>' + answer + '</p>' +
      '<h2>' + tr('rData') + '</h2><table><tbody><tr><td class="muted">' + tr('variable') + '</td><td><b>' + esc(it.varName || it.variable) + '</b>' + (it.unit ? ' (' + esc(it.unit) + ')' : '') + '</td></tr>' +
      '<tr><td class="muted">' + tr('scenario') + '</td><td>' + esc(it.scenario) + (it.warming ? ' (+' + it.warming[0] + ' °C / +' + it.warming[1] + ' °C)' : '') + '</td></tr>' +
      '<tr><td class="muted">' + tr('horizons') + '</td><td>' + esc((it.horizons || []).join(' · ')) + '</td></tr><tr><td class="muted">' + tr('rSource') + '</td><td>Climate Analytics — Climate Impact Explorer (CIE v2)</td></tr></tbody></table>' +
      '<h2>' + tr('ranking') + '</h2><table><thead><tr><th>#</th><th>' + tr('asset') + '</th><th class="num">' + esc(it.horizons[0]) + '</th><th class="num">' + esc(it.horizons[1]) + '</th><th class="num">Δ</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '<div class="note">' + tr('rNote') + '</div></body></html>');
    w.document.close();
  }

  // ---------------- Navegación y eventos ----------------
  function renderAll() {
    applyStatic();
    renderOverview(); renderQueue(); renderFeedback(); renderAudit(); renderSettings();
    ['overview', 'queue', 'feedback', 'audit', 'settings'].forEach(function (v) { document.getElementById('v-' + v).classList.toggle('hidden', v !== view); });
    document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === view); });
  }
  function go(v) { view = v; try { sessionStorage.setItem('ace-admin-tab', v); } catch (e) {} renderAll(); window.scrollTo(0, 0); }

  document.getElementById('tabs').addEventListener('click', function (e) { var b = e.target.closest('button[data-tab]'); if (b) go(b.dataset.tab); });
  document.getElementById('filters').addEventListener('click', function (e) { var b = e.target.closest('button[data-f]'); if (b) { filter = b.dataset.f; selected = null; renderQueue(); } });
  document.getElementById('list').addEventListener('click', function (e) { var b = e.target.closest('.item'); if (b) { selected = b.dataset.id; renderQueue(); } });
  document.addEventListener('click', function (e) {
    var r = e.target.closest('[data-report]'); if (r) { openReport(r.dataset.report); return; }
    var o = e.target.closest('[data-open]'); if (o) { e.preventDefault(); selected = o.dataset.open; filter = 'all'; go('queue'); return; }
    if (e.target.closest('#saveReview')) saveReview();
  });
  document.getElementById('detail').addEventListener('change', function (e) {
    if (e.target.name !== 'dec') return;
    document.getElementById('catBox').classList.toggle('hidden', e.target.value === 'approved');
    document.getElementById('corrBox').classList.toggle('hidden', e.target.value !== 'corrected');
  });
  document.getElementById('modes').addEventListener('change', function (e) { if (e.target.name === 'mode') { S.mode = e.target.value; saveState(); toast(tr('modeSaved')); renderAll(); } });
  document.getElementById('reset').addEventListener('click', function () { S = { mode:'post', items:sampleData(), audit:sampleAudit() }; mergeLive(); saveState(); selected = null; toast(tr('resetOk')); renderAll(); });
  document.getElementById('lang').addEventListener('change', function (e) { lang = e.target.value; set('ace-lang', lang); renderAll(); });
  document.getElementById('theme').addEventListener('click', function () {
    var t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = t; set('ace-theme', t); applyStatic();
  });
  // Cerrar sesión: borra la sesión del visor y la de Cloudflare Access
  document.getElementById('signout').addEventListener('click', function (e) { e.preventDefault(); del('ace-admin'); location.href = '/cdn-cgi/access/logout'; });

  // ---------------- Sesión (Cloudflare Access) ----------------
  var whoEl = document.getElementById('who');
  try { view = sessionStorage.getItem('ace-admin-tab') || 'overview'; } catch (e) {}
  if (['overview', 'queue', 'feedback', 'audit', 'settings'].indexOf(view) < 0) view = 'overview';

  fetch('/cdn-cgi/access/get-identity', { credentials: 'include', cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
    .then(function (id) {
      if (!id || !id.email) throw new Error('no email');
      set('ace-admin', JSON.stringify({ email: id.email, ts: Date.now() }));
      if (new URLSearchParams(location.search).get('login') === '1') {
        location.replace('/?admin=welcome'); // vuelve al visor con la ventana de bienvenida
        return;
      }
      USER = id.email; whoEl.textContent = USER; renderAll();
    })
    .catch(function () {
      del('ace-admin');
      document.documentElement.className = '';
      whoEl.textContent = tr('noSession'); renderAll();
    });

  mergeLive(); saveState();
  renderAll();
  </script>
</body>
</html>
